<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="robots" content="noindex, nofollow" />
    <title>PhimCuaToi.Online - Xem phim trực tuyến miễn phí</title>
    
    <!-- TV Debug Console Script & Global Polyfills -->
    <script>
      // Global Polyfills for TV browser compatibility (Chrome 53-73)
      (function() {
        // queueMicrotask Polyfill
        if (typeof window.queueMicrotask !== 'function') {
          window.queueMicrotask = function(callback) {
            Promise.resolve()
              .then(callback)
              .catch(function(err) {
                setTimeout(function() { throw err; });
              });
          };
        }

        // globalThis Polyfill
        if (typeof globalThis === 'undefined') {
          (function() {
            if (typeof self !== 'undefined') {
              self.globalThis = self;
            } else if (typeof window !== 'undefined') {
              window.globalThis = window;
            } else {
              this.globalThis = this;
            }
          })();
        }

        // Object.fromEntries Polyfill
        if (!Object.fromEntries) {
          Object.fromEntries = function(entries) {
            if (!entries || !entries[Symbol.iterator]) {
              throw new TypeError('Object.fromEntries requires an iterable object');
            }
            var obj = {};
            var iterator = entries[Symbol.iterator]();
            var next = iterator.next();
            while (!next.done) {
              var entry = next.value;
              if (entry && typeof entry === 'object') {
                obj[entry[0]] = entry[1];
              }
              next = iterator.next();
            }
            return obj;
          };
        }

        // Promise.allSettled Polyfill
        if (!Promise.allSettled) {
          Promise.allSettled = function(promises) {
            return Promise.all(
              promises.map(function(promise) {
                return Promise.resolve(promise).then(
                  function(value) {
                    return { status: 'fulfilled', value: value };
                  },
                  function(reason) {
                    return { status: 'rejected', reason: reason };
                  }
                );
              })
            );
          };
        }

        // Array.prototype.flat Polyfill
        if (!Array.prototype.flat) {
          Array.prototype.flat = function(depth) {
            var flattend = [];
            (function flat(array, depth) {
              for (var i = 0; i < array.length; i++) {
                if (Array.isArray(array[i]) && depth > 0) {
                  flat(array[i], depth - 1);
                } else {
                  flattend.push(array[i]);
                }
              }
            })(this, depth === undefined ? 1 : depth);
            return flattend;
          };
        }

        // String.prototype.replaceAll Polyfill
        if (!String.prototype.replaceAll) {
          String.prototype.replaceAll = function(str, newStr) {
            if (Object.prototype.toString.call(str) === '[object RegExp]') {
              return this.replace(str, newStr);
            }
            return this.replace(new RegExp(str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), newStr);
          };
        }
      })();

      (function() {
        var logs = [];
        window.tvDebugLogs = logs;
        function appendLog(type, msg) {
          var logLine = '[' + new Date().toISOString().substring(11, 19) + '] [' + type + '] ' + msg;
          logs.push(logLine);
          var el = document.getElementById('debug-log');
          if (el) {
            el.textContent = logs.join('\n');
            el.scrollTop = el.scrollHeight;
          }
          if (type.indexOf('ERROR') !== -1) {
            var panel = document.getElementById('debug-console');
            if (panel) panel.style.display = 'block';
          }
        }
        
        window.onerror = function(message, source, lineno, colno, error) {
          appendLog('ERROR', message + ' (' + (source ? source.substring(source.lastIndexOf('/') + 1) : '') + ':' + lineno + ':' + colno + ')');
          return false;
        };
        
        window.addEventListener('unhandledrejection', function(event) {
          appendLog('ERROR-REJECTION', event.reason ? (event.reason.message || event.reason) : 'Promise rejection');
        });

        var orgError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          appendLog('CONSOLE-ERROR', args.join(' '));
          orgError.apply(console, arguments);
        };

        var orgLog = console.log;
        console.log = function() {
          var args = Array.prototype.slice.call(arguments);
          appendLog('INFO', args.join(' '));
          orgLog.apply(console, arguments);
        };

        // Key press counter to toggle console (Press number '0' 5 times)
        var zeroCount = 0;
        window.addEventListener('keydown', function(e) {
          var code = e.keyCode || e.which;
          appendLog('KEY', 'Pressed keycode: ' + code);
          if (code === 48 || code === 96) { // '0' key
            zeroCount++;
            if (zeroCount >= 5) {
              var panel = document.getElementById('debug-console');
              if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
              zeroCount = 0;
            }
          } else {
            zeroCount = 0;
          }
        });
        
        // Touch/Click top-left to toggle console
        var clickCount = 0;
        window.addEventListener('click', function(e) {
          if (e.clientX < 60 && e.clientY < 60) {
            clickCount++;
            if (clickCount >= 5) {
              var panel = document.getElementById('debug-console');
              if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
              clickCount = 0;
            }
          } else {
            clickCount = 0;
          }
        });
      })();
    </script>
  </head>
  <body>
    <!-- TV Debug Console UI Overlay -->
    <div id="debug-console" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);color:#0f0;z-index:999999;padding:20px;font-family:monospace;font-size:12px;overflow:auto;">
      <h3 style="margin:0 0 10px 0;color:#fff;border-bottom:1px solid #333;padding-bottom:5px;">TV Debug Console</h3>
      <pre id="debug-log" style="white-space:pre-wrap;margin:0;"></pre>
      <button onclick="document.getElementById('debug-console').style.display='none'" style="position:fixed;top:10px;right:10px;background:#c00;color:#fff;border:none;padding:5px 10px;font-weight:bold;cursor:pointer;z-index:1000000;">Close</button>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
