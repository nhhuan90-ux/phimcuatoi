<!DOCTYPE html>
<html lang="vi-VN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xem Phim</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; }
    .header { background: #111; padding: 12px 20px; border-bottom: 2px solid #e94560; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
    .header a { color: #e94560; text-decoration: none; font-size: 14px; }
    .header a:hover { color: #fff; }
    .header .logo { font-size: 20px; font-weight: 800; color: #e94560; }
    .header .logo span { color: #fff; }
    .player-wrap { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    .player-container { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
    .player-container video, .player-container iframe { width: 100%; display: block; }
    .player-container iframe { border: none; }
    #movieInfo { max-width: 1000px; margin: 15px auto; padding: 0 15px; }
    #movieTitle { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    #movieMeta { color: #888; font-size: 13px; }
    #movieMeta .tag { background: #e94560; padding: 2px 10px; border-radius: 10px; color: #fff; font-size: 11px; }
    .server-bar { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; align-items: center; }
    .server-bar .label { color: #666; font-size: 13px; margin-right: 4px; }
    .server-btn { padding: 8px 18px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #ccc; cursor: pointer; font-size: 13px; transition: .3s; }
    .server-btn:hover, .server-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
    .back-btn { padding: 8px 18px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #ccc; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
    .back-btn:hover { background: #e94560; border-color: #e94560; color: #fff; }
    .loading-player { text-align: center; padding: 100px 20px; color: #555; }
    .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #e94560; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { text-align: center; padding: 60px 20px; color: #e94560; }
    @media (max-width: 768px) {
      .player-wrap { margin: 10px auto; padding: 0 10px; }
      #movieTitle { font-size: 16px; }
    }
  </style>
</head>
<body>
<div class="header">
  <a href="/" class="logo" style="display: flex; align-items: center; transition: transform 0.2s;">
    <img src="/logo.png" alt="PhimCuaToi.Online" style="height: 32px; width: auto; max-height: 32px; object-fit: contain;" />
  </a>
  <a href="/the-loai/phim-18?tab=adult" onclick="goBack(); return false;">&larr; Quay lại</a>
  <span id="movieBreadcrumb" style="color:#666;font-size:13px;"></span>
</div>

<div class="player-wrap">
  <div id="playerLoading" class="loading-player">
    <div class="spinner"></div>
    Đang tải video...
  </div>
  <div id="playerContainer" class="player-container" style="display:none;"></div>

  <div class="server-bar" id="serverBar" style="display:none;"></div>

  <div id="movieInfo">
    <div id="movieTitle"></div>
    <div id="movieMeta"></div>
  </div>
</div>

<script>
function getQueryParam(name) {
  var match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
  return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
}

function ajaxGet(url, callback) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          callback(null, JSON.parse(xhr.responseText));
        } catch (e) {
          callback(e);
        }
      } else {
        callback(new Error('Status: ' + xhr.status));
      }
    }
  };
  xhr.send();
}

function goBack() {
  var fallbackUrl = '/the-loai/phim-18?tab=adult';
  if (window.parent && window.parent !== window) {
    window.parent.history.back();
    setTimeout(function() {
      window.parent.location.href = fallbackUrl;
    }, 150);
  } else {
    window.history.back();
    setTimeout(function() {
      window.location.href = fallbackUrl;
    }, 150);
  }
}

var source = getQueryParam('source');
var id = getQueryParam('id');
var currentServer = 1;
var hlsInstance = null;

var serverList = {
  javhdz: [
    { label: 'Xem tại JAVHDz', id: 'embed' }
  ],
  vlxx: [
    { label: 'Server #1', id: 1 },
    { label: 'Server #2', id: 2 }
  ],
  javsub: [
    { label: 'StreamQQ', id: 1 },
    { label: 'PlayHQ', id: 2 }
  ],
  missav: [
    { label: 'Server chính', id: 'embed' }
  ],
  javtiful: [
    { label: 'Xem tại JavTiful', id: 'embed' }
  ],
  supjav: [
    { label: 'Server #1', id: 1 },
    { label: 'Server #2', id: 2 }
  ],
  phimxyz: [
    { label: 'Server m3u8', id: 1 }
  ],
  njav: [
    { label: 'Xem tại NJAV', id: 1 }
  ],
  subjav: [
    { label: 'Server m3u8', id: 1 }
  ]
};

function loadDirectVideo(videoUrl) {
  document.getElementById('playerLoading').style.display = 'none';
  var container = document.getElementById('playerContainer');
  container.style.display = 'block';

  container.innerHTML = '<video id="videoPlayer" controls autoplay style="width:100%;max-height:70vh;background:#000;"></video>';
  var video = document.getElementById('videoPlayer');
  
  if (typeof Hls !== 'undefined' && Hls.isSupported()) {
    if (hlsInstance) hlsInstance.destroy();
    hlsInstance = new Hls({ maxBufferLength: 8, maxMaxBufferLength: 15, maxBufferSize: 10 * 1000 * 1000 });
    hlsInstance.loadSource(videoUrl);
    hlsInstance.attachMedia(video);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
      video.play();
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl') || video.canPlayType('application/x-mpegURL')) {
    video.src = videoUrl;
    video.play();
  } else {
    // Trình duyệt không hỗ trợ HLS -> fallback sang iframe player
    document.getElementById('playerLoading').style.display = 'none';
    var fallbackUrl = 'https://player.phimapi.com/player/?url=' + encodeURIComponent(videoUrl);
    container.innerHTML = '<div class="error-msg" style="padding:40px 20px;">' +
      '<p style="margin-bottom:16px;font-size:15px;">Trình duyệt không hỗ trợ phát HLS trực tiếp</p>' +
      '<a href="' + fallbackUrl + '" target="_blank" style="display:inline-block;padding:12px 30px;border-radius:8px;background:#e94560;color:#fff;text-decoration:none;font-size:16px;font-weight:600;">&#9654; Xem Phim Ngay</a>' +
      '</div>';
  }
}

function loadMovie() {
  var directUrl = getQueryParam('url');
  var movieTitle = getQueryParam('title');

  if (directUrl) {
    document.getElementById('movieTitle').textContent = movieTitle || 'Xem Phim';
    document.getElementById('movieBreadcrumb').textContent = movieTitle || 'Xem Phim';
    document.getElementById('movieMeta').innerHTML = '<span class="tag">Direct Play</span>';
    document.title = (movieTitle || 'Xem Phim') + ' - Phim Tổng Hợp';
    
    var bar = document.getElementById('serverBar');
    if (bar) bar.style.display = 'none';
    
    loadDirectVideo(directUrl);
    return;
  }

  if (!source || !id) {
    document.getElementById('playerLoading').innerHTML = '<div class="error-msg">Thiếu thông tin phim. <a href="/the-loai/phim-18?tab=adult" onclick="goBack(); return false;" style="color:#e94560;">Quay lại</a></div>';
    return;
  }

  ajaxGet('/api/movie/' + source + '/' + id, function(err, movie) {
    if (err) {
      document.getElementById('playerLoading').innerHTML = '<div class="error-msg">Không tìm thấy phim</div>';
      return;
    }

    document.getElementById('movieTitle').textContent = movie.title;
    document.getElementById('movieBreadcrumb').textContent = movie.title;
    
    var sourceNames = {
      javhdz: 'JAVHDz',
      vlxx: 'VLXX',
      javsub: 'JAVSub',
      missav: 'MissAV',
      javtiful: 'JavTiful',
      supjav: 'SupJav',
      phimxyz: 'PhimXYZ',
      njav: 'NJAV',
      bestjav: 'BestJAV'
    };

    document.getElementById('movieMeta').innerHTML = 
      '<span class="tag">' + (movie.tag || movie.source) + '</span>' +
      '<span style="margin-left:10px;">' + (sourceNames[movie.source] || movie.source) + '</span>' +
      (movie.views ? '<span style="margin-left:10px;">&#128065; ' + movie.views + '</span>' : '');

    document.title = movie.title + ' - Phim Tổng Hợp';

    if (movie.embedUrls && movie.embedUrls.length > 0) {
      serverList[source] = movie.embedUrls.map(function(s, idx) {
        return {
          label: s.label || ('Server #' + (idx + 1)),
          id: idx + 1
        };
      });
    }

    buildServerBar();
    loadVideo(currentServer);
  });
}

function buildServerBar() {
  var bar = document.getElementById('serverBar');
  var servers = serverList[source];
  if (!servers || servers.length <= 1) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  bar.innerHTML = '<span class="label">Server:</span>';
  
  for (var i = 0; i < servers.length; i++) {
    (function(s) {
      var btn = document.createElement('button');
      btn.className = 'server-btn' + (s.id === currentServer ? ' active' : '');
      btn.textContent = s.label;
      btn.onclick = function() {
        switchServer(s.id);
      };
      bar.appendChild(btn);
    })(servers[i]);
  }
}

function switchServer(s) {
  currentServer = s;
  buildServerBar();
  loadVideo(s);
}

function loadVideo(server) {
  document.getElementById('playerLoading').style.display = 'block';
  document.getElementById('playerContainer').style.display = 'none';

  var needsServer = ['vlxx', 'javsub', 'supjav'].indexOf(source) !== -1;
  var url = '/api/video/' + source + '/' + id + (needsServer ? '?server=' + server : '');

  ajaxGet(url, function(err, data) {
    if (err) {
      document.getElementById('playerLoading').innerHTML = 
        '<div class="error-msg">' +
        '<p>Lỗi tải video. Video có thể đã bị gỡ hoặc link lỗi thời.</p>' +
        '<button onclick="loadVideo(' + server + ')" style="padding:8px 20px;border-radius:6px;background:#e94560;color:#fff;border:none;cursor:pointer;margin-top:10px;">Thử lại</button>' +
        '</div>';
      return;
    }

    document.getElementById('playerLoading').style.display = 'none';
    var container = document.getElementById('playerContainer');
    container.style.display = 'block';

    if (source === 'javhdz') {
      var embedUrl = '/api/embed/javhdz/' + id;
      container.innerHTML = '<iframe src="' + embedUrl + '" allow="autoplay;fullscreen" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms" style="width:100%;height:70vh;border:none;background:#000;"></iframe>';
    } else if (source === 'vlxx') {
      if (data.videoUrl) {
        container.innerHTML = '<video id="videoPlayer" controls autoplay style="width:100%;max-height:70vh;background:#000;"></video>';
        var video = document.getElementById('videoPlayer');
        var proxyUrl = '/api/proxy/hls?url=' + encodeURIComponent(data.videoUrl);
        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
          if (hlsInstance) hlsInstance.destroy();
          hlsInstance = new Hls({ maxBufferLength: 8, maxMaxBufferLength: 15, maxBufferSize: 10 * 1000 * 1000 });
          hlsInstance.loadSource(proxyUrl);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play();
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = proxyUrl;
          video.play();
        } else {
          container.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#e94560;"><p style="margin-bottom:16px;font-size:15px;">Trình duyệt không hỗ trợ phát HLS trực tiếp</p><a href="' + proxyUrl + '" target="_blank" style="display:inline-block;padding:12px 30px;border-radius:8px;background:#e94560;color:#fff;text-decoration:none;font-size:16px;font-weight:600;">&#9654; Xem Phim Ngay</a></div>';
        }
      } else if (data.url) {
        container.innerHTML = '<iframe src="' + data.url + '" allow="autoplay;fullscreen" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms" style="width:100%;height:60vh;border:none;background:#000;"></iframe>';
      } else {
        container.innerHTML = '<div class="error-msg">Không lấy được link phát.</div>';
      }
    } else if (source === 'javsub') {
      if (data.videoUrl) {
        container.innerHTML = '<video id="videoPlayer" controls autoplay style="width:100%;max-height:70vh;background:#000;"></video>';
        var video = document.getElementById('videoPlayer');
        var proxyUrl = data.videoUrl;
        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
          if (hlsInstance) hlsInstance.destroy();
          hlsInstance = new Hls({ maxBufferLength: 8, maxMaxBufferLength: 15, maxBufferSize: 10 * 1000 * 1000 });
          hlsInstance.loadSource(proxyUrl);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play();
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = proxyUrl;
          video.play();
        } else {
          container.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#e94560;"><p style="margin-bottom:16px;font-size:15px;">Trình duyệt không hỗ trợ phát HLS trực tiếp</p><a href="' + proxyUrl + '" target="_blank" style="display:inline-block;padding:12px 30px;border-radius:8px;background:#e94560;color:#fff;text-decoration:none;font-size:16px;font-weight:600;">&#9654; Xem Phim Ngay</a></div>';
        }
      } else {
        var src = data.url || (data.sources && data.sources[server - 1] ? data.sources[server - 1].url : '');
        if (src) {
          container.innerHTML = '<iframe src="' + src + '" allow="autoplay;fullscreen" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms" style="width:100%;height:60vh;border:none;background:#000;"></iframe>';
        } else {
          container.innerHTML = '<div class="error-msg">Không lấy được link phát.</div>';
        }
      }
    } else if (source === 'phimxyz' || source === 'subjav') {
      if (data.videoUrl) {
        container.innerHTML = '<video id="videoPlayer" controls autoplay style="width:100%;max-height:70vh;background:#000;"></video>';
        var video = document.getElementById('videoPlayer');
        var proxyUrl = '/api/proxy/hls?url=' + encodeURIComponent(data.videoUrl);
        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
          if (hlsInstance) hlsInstance.destroy();
          hlsInstance = new Hls({ maxBufferLength: 8, maxMaxBufferLength: 15, maxBufferSize: 10 * 1000 * 1000 });
          hlsInstance.loadSource(proxyUrl);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play();
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = proxyUrl;
          video.play();
        } else {
          container.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#e94560;"><p style="margin-bottom:16px;font-size:15px;">Trình duyệt không hỗ trợ phát HLS trực tiếp</p><a href="' + proxyUrl + '" target="_blank" style="display:inline-block;padding:12px 30px;border-radius:8px;background:#e94560;color:#fff;text-decoration:none;font-size:16px;font-weight:600;">&#9654; Xem Phim Ngay</a></div>';
        }
      } else {
        container.innerHTML = '<div class="error-msg">Không lấy được link phát.</div>';
      }
    } else if (source === 'missav') {
      if (data.videoUrl) {
        container.innerHTML = '<video id="videoPlayer" controls autoplay style="width:100%;max-height:70vh;background:#000;"></video>';
        var video = document.getElementById('videoPlayer');
        var proxyUrl = '/api/proxy/hls?url=' + encodeURIComponent(data.videoUrl);
        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
          if (hlsInstance) hlsInstance.destroy();
          hlsInstance = new Hls({ maxBufferLength: 8, maxMaxBufferLength: 15, maxBufferSize: 10 * 1000 * 1000 });
          hlsInstance.loadSource(proxyUrl);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play();
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = proxyUrl;
          video.play();
        } else {
          container.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#e94560;"><p style="margin-bottom:16px;font-size:15px;">Trình duyệt không hỗ trợ phát HLS trực tiếp</p><a href="' + proxyUrl + '" target="_blank" style="display:inline-block;padding:12px 30px;border-radius:8px;background:#e94560;color:#fff;text-decoration:none;font-size:16px;font-weight:600;">&#9654; Xem Phim Ngay</a></div>';
        }
      } else {
        container.innerHTML = '<div class="error-msg">Không lấy được link phát.</div>';
      }
    } else if (source === 'javtiful') {
      container.innerHTML = '<iframe src="' + (data.url || '') + '" allow="autoplay;fullscreen" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms" style="width:100%;height:60vh;border:none;background:#000;"></iframe>';
    } else if (source === 'supjav') {
      if (data.sources && data.sources[0]) {
        var srcUrl = data.sources[server - 1] ? data.sources[server - 1].url : data.sources[0].url;
        container.innerHTML = '<iframe src="' + srcUrl + '" allow="autoplay;fullscreen" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms" style="width:100%;height:60vh;border:none;background:#000;"></iframe>';
      } else if (data.url) {
        container.innerHTML = '<p style="text-align:center;padding:40px;color:#888;">SupJav không hỗ trợ xem trực tiếp qua player.<br><br><a href="' + data.url + '" target="_blank" style="padding:12px 30px;border-radius:8px;background:#e94560;color:#fff;text-decoration:none;font-size:16px;">Mở tại SupJav &rarr;</a></p>';
      } else {
        container.innerHTML = '<div class="error-msg">Không lấy được link phát.</div>';
      }
    } else if (source === 'njav' || source === 'bestjav') {
      var link = data.url || '';
      if (link) {
        container.innerHTML = '<p style="text-align:center;padding:40px;color:#888;">Nguồn này không hỗ trợ xem trực tiếp qua player.<br><br><a href="' + link + '" target="_blank" style="padding:12px 30px;border-radius:8px;background:#e94560;color:#fff;text-decoration:none;font-size:16px;">Mở tại trang chính &rarr;</a></p>';
      } else {
        container.innerHTML = '<div class="error-msg">Không lấy được link phát.</div>';
      }
    } else {
      container.innerHTML = '<div class="error-msg">Nguồn không hỗ trợ</div>';
    }
  });
}

loadMovie();
</script>
</body>
</html>
