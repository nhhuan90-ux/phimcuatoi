<!DOCTYPE html>
<html lang="vi-VN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phim Tổng Hợp - Home</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d0d; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; }
    .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); padding: 16px 0; border-bottom: 3px solid #e94560; position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .logo { font-size: 26px; font-weight: 800; color: #e94560; text-decoration: none; }
    .logo span { color: #fff; }
    .logo small { font-size: 11px; font-weight: 400; color: #aaa; display: block; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .banner { background: linear-gradient(135deg, #e94560, #0f3460); padding: 30px; border-radius: 12px; margin-bottom: 30px; text-align: center; }
    .banner h2 { font-size: 26px; margin-bottom: 8px; }
    .banner p { color: #ddd; font-size: 14px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 200px; padding: 12px 18px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 14px; }
    .search-box:focus { outline: none; border-color: #e94560; }
    .filter-btn { padding: 10px 20px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #ccc; cursor: pointer; font-size: 14px; transition: .3s; }
    .filter-btn:hover, .filter-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .movie-card { background: #1a1a1a; border-radius: 10px; overflow: hidden; transition: .3s; border: 1px solid #2a2a2a; cursor: pointer; text-decoration: none; color: inherit; }
    .movie-card:hover { transform: translateY(-4px); border-color: #e94560; box-shadow: 0 8px 25px rgba(233,69,96,.2); }
    .movie-card .thumb { width: 100%; aspect-ratio: 3/2; object-fit: cover; display: block; background: #222; }
    .movie-card .info { padding: 12px; }
    .movie-card .title { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    .movie-card .meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .movie-card .tag { background: #e94560; padding: 2px 10px; border-radius: 10px; font-size: 11px; color: #fff; display: inline-block; }
    .movie-card .badge { font-size: 10px; color: #888; }
    .ribbon { position: relative; }
    .ribbon-badge { position: absolute; top: 8px; left: 8px; background: #e94560; padding: 2px 10px; border-radius: 4px; font-size: 11px; color: #fff; z-index: 2; }
    .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 30px; flex-wrap: wrap; }
    .page-btn { padding: 8px 16px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #ccc; cursor: pointer; font-size: 13px; }
    .page-btn:hover, .page-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
    .page-btn:disabled { opacity: .4; cursor: default; }
    .loading { text-align: center; padding: 40px; color: #555; }
    .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #e94560; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .stats { color: #555; font-size: 13px; margin-top: 20px; text-align: center; }
    .footer { text-align: center; padding: 30px 20px; border-top: 1px solid #222; color: #555; font-size: 13px; }
    .footer a { color: #e94560; text-decoration: none; }
    @media (max-width: 768px) {
      .movie-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    }
  </style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <a href="/" class="logo" style="display: flex; align-items: center; transition: transform 0.2s;">
      <img src="/logo.png" alt="PhimCuaToi.Online" style="height: 36px; width: auto; max-height: 36px; object-fit: contain;" />
    </a>
    <div style="display:flex;gap:12px;font-size:13px;color:#888;align-items:center;flex-wrap:wrap;">
      <span id="statsDisplay">Đang tải...</span>
      <span id="updateStatus" style="font-size:11px;color:#444;"></span>
    </div>
  </div>
</div>

<div class="container">
  <div class="banner">
    <h2>&#127909; Kho Phim Tổng Hợp</h2>
    <p>Xem phim trực tiếp &bull; Player riêng &bull; Không chuyển trang gốc</p>
  </div>

  <div class="toolbar">
    <input type="text" class="search-box" id="searchInput" placeholder="Tìm kiếm phim..." onkeydown="if(event.key==='Enter')loadMovies(1)">
    <button class="filter-btn active" onclick="setSource('all')">&#9733; Tất cả</button>
    <button class="filter-btn" onclick="setSource('javhdz')">JAVHDz</button>
    <button class="filter-btn" onclick="setSource('vlxx')">VLXX</button>
    <button class="filter-btn" onclick="setSource('javsub')">JAVSub</button>
    <button class="filter-btn" onclick="setSource('missav')">MissAV</button>
    <button class="filter-btn" onclick="setSource('javtiful')">JavTiful</button>
    <button class="filter-btn" onclick="setSource('supjav')">SupJav</button>
    <button class="filter-btn" onclick="setSource('phimxyz')">PhimXYZ</button>
    <button class="filter-btn" onclick="setSource('njav')">NJAV</button>
    <button class="filter-btn" onclick="setSource('bestjav')">BestJAV</button>
  </div>

  <div id="content">
    <div class="loading"><div class="spinner"></div>Đang tải danh sách phim...</div>
  </div>

  <div class="pagination" id="pagination"></div>
  <div class="stats" id="statsBottom"></div>
</div>

<div class="footer">
  <p>Nguồn phim từ <a href="https://javhdz.mobi/" target="_blank">JAVHDz.mobi</a>, <a href="https://vlxx.moi/" target="_blank">VLXX.moi</a>, <a href="https://javsub.blog/" target="_blank">JAVSub.blog</a>, <a href="https://missav.ai/" target="_blank">MissAV</a>, <a href="https://javtiful.com/" target="_blank">JavTiful.com</a>, <a href="https://supjav.com/" target="_blank">SupJav.com</a></p>
  <p>&copy; 2026 Phim Tổng Hợp</p>
</div>

<script>
let currentSource = 'all';
let currentSearch = '';
let totalMovies = 0;

async function loadMovies(page = 1) {
  const q = document.getElementById('searchInput').value;
  currentSearch = q;
  const params = new URLSearchParams({ page, limit: 50 });
  if (currentSource !== 'all') params.set('source', currentSource);
  if (q) params.set('search', q);

  document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div>Đang tải...</div>';

  try {
    const res = await fetch(`/api/movies?${params}`);
    const data = await res.json();
    totalMovies = data.total;

    const grid = document.createElement('div');
    grid.className = 'movie-grid';

    data.items.forEach(m => {
      const card = document.createElement('a');
      card.className = 'movie-card';
      card.href = `/player.html?source=${m.source}&id=${m.id}`;
      card.innerHTML = `
        <div class="ribbon">
          <img class="thumb" src="${m.img}" alt="${m.title}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 240 180%22><rect fill=%22%23333%22 width=%22240%22 height=%22180%22/><text x=%22120%22 y=%2290%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2214%22>No Image</text></svg>'">
          <span class="ribbon-badge">${m.tag || m.source}</span>
        </div>
        <div class="info">
          <div class="title">${m.title}</div>
          <div class="meta">
            <span class="badge">${({javhdz:'JAVHDz',vlxx:'VLXX',javsub:'JAVSub',missav:'MissAV',javtiful:'JavTiful',supjav:'SupJav',phimxyz:'PhimXYZ',njav:'NJAV',bestjav:'BestJAV'})[m.source] || m.source}</span>
            ${m.views ? '<span class="badge">&#128065; ' + m.views + '</span>' : ''}
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    document.getElementById('content').innerHTML = '';
    if (data.items.length === 0) {
      document.getElementById('content').innerHTML = '<div style="text-align:center;padding:60px;color:#555;">Không tìm thấy phim nào</div>';
    } else {
      document.getElementById('content').appendChild(grid);
    }

    renderPagination(data.total, data.page, Math.ceil(data.total / data.limit));
    document.getElementById('statsBottom').textContent = `Tổng: ${data.total} phim (Trang ${data.page}/${Math.ceil(data.total / data.limit)})`;
  } catch (e) {
    document.getElementById('content').innerHTML = '<div style="text-align:center;padding:60px;color:#e94560;">Lỗi tải dữ liệu. Vui lòng refresh.</div>';
  }
}

function renderPagination(total, current, totalPages) {
  const el = document.getElementById('pagination');
  el.innerHTML = '';
  if (totalPages <= 1) return;

  const add = (label, page, disabled = false) => {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (page === current ? ' active' : '');
    btn.innerHTML = label;
    btn.disabled = disabled || page === current;
    btn.onclick = () => loadMovies(page);
    el.appendChild(btn);
  };

  add('&#171;', 1, current === 1);
  add('&#8249;', current - 1, current === 1);

  let start = Math.max(1, current - 2);
  let end = Math.min(totalPages, current + 2);
  if (start > 1) { add('1', 1); if (start > 2) el.innerHTML += '<span style="color:#555;padding:8px;">...</span>'; }
  for (let i = start; i <= end; i++) add(i, i);
  if (end < totalPages) { if (end < totalPages - 1) el.innerHTML += '<span style="color:#555;padding:8px;">...</span>'; add(totalPages, totalPages); }

  add('&#8250;', current + 1, current === totalPages);
  add('&#187;', totalPages, current === totalPages);
}

function setSource(source) {
  currentSource = source;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.filter-btn').forEach(b => {
    const labels = { all:'Tất cả', javhdz:'JAVHDz', vlxx:'VLXX', javsub:'JAVSub', missav:'MissAV', javtiful:'JavTiful', supjav:'SupJav', phimxyz:'PhimXYZ', njav:'NJAV', bestjav:'BestJAV' };
    if (b.textContent.includes(labels[source])) b.classList.add('active');
  });
  loadMovies(1);
}

async function loadStats() {
  try {
    const [statsRes, adminRes] = await Promise.all([
      fetch('/api/stats'),
      fetch('/api/admin/status')
    ]);
    const data = await statsRes.json();
    const admin = await adminRes.json();
    document.getElementById('statsDisplay').innerHTML = `JAVHDz: ${data.javhdz} &bull; VLXX: ${data.vlxx} &bull; JAVSub: ${data.javsub} &bull; MissAV: ${data.missav} &bull; JavTiful: ${data.javtiful} &bull; SupJav: ${data.supjav} &bull; PhimXYZ: ${data.phimxyz} &bull; NJAV: ${data.njav} &bull; BestJAV: ${data.bestjav} &bull; Tổng: ${data.total}`;
    const updateEl = document.getElementById('updateStatus');
    if (admin.lastCheck) {
      const d = new Date(admin.lastCheck);
      updateEl.textContent = `Cập nhật: ${d.toLocaleDateString('vi-VN')} ${d.toLocaleTimeString('vi-VN')}`;
    }
  } catch (e) {}
}

loadStats();
loadMovies();
</script>
</body>
</html>
